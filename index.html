<!doctype html>
<html lang="en" data-reading-mode="off" data-reading-appearance="dark" data-reading-temperature="neutral" data-reading-text-scale="1">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Swavik Patra — backend engineer in Bhubaneswar, India. Go and Python services, FastAPI, PostgreSQL, Redis."
    />
    <title>Swavik Patra — Software Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var root = document.documentElement
        try {
          root.setAttribute('data-reading-mode', localStorage.getItem('portfolio-reading-mode') === 'on' ? 'on' : 'off')
          var appearance = localStorage.getItem('portfolio-reading-appearance')
          if (appearance !== 'dark' && appearance !== 'light') {
            appearance = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          root.setAttribute('data-reading-appearance', appearance)
          var temperature = localStorage.getItem('portfolio-reading-temperature')
          root.setAttribute('data-reading-temperature', temperature === 'cool' || temperature === 'neutral' || temperature === 'warm' ? temperature : 'neutral')
          var scale = Number(localStorage.getItem('portfolio-reading-text-scale'))
          root.setAttribute('data-reading-text-scale', scale === 0.9 || scale === 1 || scale === 1.1 ? String(scale) : '1')
        } catch (e) {
          root.setAttribute('data-reading-mode', 'off')
          root.setAttribute('data-reading-appearance', 'dark')
          root.setAttribute('data-reading-temperature', 'neutral')
          root.setAttribute('data-reading-text-scale', '1')
        }
      })()
    </script>
    <script>
      (function () {
        try {
          var p = new URLSearchParams(location.search)
          var scene = p.get('scene')
          if (scene && ['morning','noon','sunset','night'].indexOf(scene) !== -1) {
            localStorage.setItem('portfolio-scene-theme', scene)
          }
          if (p.get('fast') === '1') {
            document.documentElement.style.scrollBehavior = 'auto'
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
